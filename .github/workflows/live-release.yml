name: Alpha.7 push-triggered required-OIDC preview
on:
  push:
    branches: [alpha, main]
permissions:
  contents: write
  id-token: write
concurrency:
  group: workspace-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  required-oidc-preview:
    environment: public-npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - run: npm install --global npm@12.2.1
      - run: |
          npm install --global pnpm@12.15.0
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify exact public product and literal intent guard
        run: |
          mkdir -p evidence/alpha7-preview
          node --test scripts/preview-alpha7.test.mjs
          node --version > evidence/alpha7-preview/tools.txt
          command -v npm >> evidence/alpha7-preview/tools.txt
          npm --version >> evidence/alpha7-preview/tools.txt
          echo "ACCEPTANCE_NPM_PATH=$(dirname "$(command -v npm)")" >> "$GITHUB_ENV"
      - name: Real CLI preview with no registry writes or identity requests
        run: node scripts/preview-alpha7.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: alpha7-push-preview-pnpm-${{ github.run_id }}
          path: evidence/alpha7-preview/
